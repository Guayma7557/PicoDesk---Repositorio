<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nivel - 1</title>
  <link rel="stylesheet" href="nivel_1.css" />
</head>
<body>

  <section class="pantalla-niveles">

    <!-- Secuencia de fondo a pantalla completa. Arranca mostrando
         "Fondo inclinado - Nivel 1" (toma de la torre completa) y, a los 3s,
         hace un cross-fade con "Fondo superior - Nivel 1" (bandeja vacía).
         Cuando el jugador coloca la placa madre, herramientas_nivel_1.js le
         agrega una clase a ".fondo-marco" que dispara OTRO cross-fade hacia
         "Fondo superior - Nivel 2", que ya trae la placa dibujada en su
         posición/rotación final correcta (encarada hacia la placa de
         puertos del gabinete) -- por eso ya no hace falta un sprite aparte
         para la placa "colocada": el propio fondo la muestra. Las tres
         imágenes comparten la misma proporción real (521x260), así que
         ".fondo-marco" respeta esa proporción para que la zona interactiva
         calce siempre con el dibujo, sea cual sea el tamaño de pantalla. -->
    <div class="fondo-marco">
      <img
        src="../../../Recursos_Gráficos/Sprites/Fondo inclinado - Nivel 1.png"
        alt=""
        class="fondo-capa fondo-inclinado"
        aria-hidden="true"
      />
      <img
        src="../../../Recursos_Gráficos/Sprites/Fondo superior - Nivel 1.png"
        alt="Vista cercana de la bandeja de montaje de la placa madre, todavía vacía"
        class="fondo-capa fondo-superior"
      />
      <img
        src="../../../Recursos_Gráficos/Sprites/Fondo superior - Nivel 2.png"
        alt="Placa madre ya colocada y encarada hacia la placa de puertos del gabinete"
        class="fondo-capa fondo-superior-n2"
      />

      <div class="zona-placa-madre">
        <span class="zona-placa-madre__etiqueta">Zona de la placa madre</span>

        <!-- Los 5 puntos de fijación para los tornillos: 4 en las esquinas
             y 1 en el medio del borde derecho. Arrancan ocultos (ver CSS
             ".placa-colocada .punto-tornillo") y solo se revelan una vez
             que la placa madre ya está puesta. -->
        <button type="button" class="punto-tornillo punto-tornillo--1" data-colocado="false" data-apretado="false" aria-label="Punto de fijación 1"></button>
        <button type="button" class="punto-tornillo punto-tornillo--2" data-colocado="false" data-apretado="false" aria-label="Punto de fijación 2"></button>
        <button type="button" class="punto-tornillo punto-tornillo--3" data-colocado="false" data-apretado="false" aria-label="Punto de fijación 3"></button>
        <button type="button" class="punto-tornillo punto-tornillo--4" data-colocado="false" data-apretado="false" aria-label="Punto de fijación 4"></button>
        <button type="button" class="punto-tornillo punto-tornillo--5" data-colocado="false" data-apretado="false" aria-label="Punto de fijación 5"></button>
      </div>
    </div>

    <!-- Panel de misiones, paso a paso -->
    <aside class="panel-misiones" aria-label="Misiones del nivel">
      <h2 class="panel-misiones__titulo">Misiones</h2>
      <ol class="panel-misiones__lista">
        <li class="mision" data-mision="colocar-placa">
          <span class="mision__marca"></span>
          <span class="mision__texto">Colocar la placa madre</span>
        </li>
        <li class="mision oculta" data-mision="colocar-tornillos">
          <span class="mision__marca"></span>
          <span class="mision__texto">Colocar los 5 tornillos</span>
        </li>
        <li class="mision oculta" data-mision="ajustar-tornillos">
          <span class="mision__marca"></span>
          <span class="mision__texto">Ajustar los tornillos</span>
        </li>
      </ol>
    </aside>

    <div class="barra-herramientas" role="toolbar" aria-label="Herramientas del nivel">
      <!-- Cada herramienta tiene data-herramienta + data-uso (o
           data-usos-restantes para las que se gastan). "placa-madre" y
           "tornillo" se pueden arrastrar (drag) directo a su destino, o
           seleccionar con click y después click en el destino. -->
      <button
        type="button"
        class="barra-herramientas__item"
        data-herramienta="placa-madre"
        data-uso="unico"
      >
        <img src="../../../Recursos_Gráficos/Sprites/Motherboard/Motherboard_Frente.png" alt="Placa madre" />
      </button>

      <button
        type="button"
        class="barra-herramientas__item"
        data-herramienta="destornillador"
        data-uso="ilimitado"
      >
        <img src="../../../Recursos_Gráficos/Sprites/Destornillador.png" alt="Destornillador" />
      </button>

      <button
        type="button"
        class="barra-herramientas__item"
        data-herramienta="tornillo"
        data-usos-restantes="5"
      >
        <img src="../../../Recursos_Gráficos/Sprites/tornillo.png" alt="Tornillo" />
        <span class="barra-herramientas__contador">5</span>
      </button>

      <div class="barra-herramientas__item"></div>
      <div class="barra-herramientas__item"></div>
    </div>
    <div class="barra-lateral">
      <!-- Botón para salir: triángulo -->
      <button type="button" class="boton-salir" aria-label="Salir"></button>

      <div
        class="barra-progreso"
        role="progressbar"
        aria-valuenow="0"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-label="Progreso del nivel"
      >
        <div class="barra-progreso__relleno" style="--progreso: 0%"></div>
      </div>
    </div>

  <div class="overlay-confirmacion" aria-hidden="true">
      <div
        class="dialogo-confirmacion"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="dialogo-confirmacion-texto"
      >
        <p id="dialogo-confirmacion-texto" class="dialogo-confirmacion__texto">
          ¿Estas seguro de salir?
        </p>
 
        <div class="dialogo-confirmacion__opciones">
          <!-- "Sí": texto interactivo -->
          <button type="button" class="dialogo-confirmacion__si">Si</button>
 
          <!-- "No": botón rojo -->
          <button type="button" class="dialogo-confirmacion__no">No</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Secuencia de fondo (fade del "Fondo inclinado" hacia el "Fondo superior") -->
  <script src="secuencia_fondo_nivel_1.js"></script>
  <!-- Lógica de selección/arrastre y uso de herramientas -->
  <script src="herramientas_nivel_1.js"></script>
  <!-- Panel de misiones paso a paso -->
  <script src="misiones_nivel_1.js"></script>
  <script src="nivel_1.js"></script>
  <script src="puntaje_nivel_1.js"></script>
</body>
</html>
