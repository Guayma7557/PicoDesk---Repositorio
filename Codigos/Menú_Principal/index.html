<!DOCTYPE html>
<html lang="es">
<head>
    <!-- -------------------- SEO BÁSICO -------------------- -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> PicoDesk - Menú </title>

    <!-- -------------------- FAVICON -------------------- -->
    <link rel="icon" href="../../Recursos_Gráficos/Sprites/Icons/LOGO.ico">

    <!-- -------------------- SEO REDES SOCIALES -------------------- -->
    <meta og:title content="PicoDesk">
    <meta og:description content="Jugá y aprendé sobre las TICs con PicoDesk">
    <meta og:image content="../Recursos_Gráficos/Sprites/LOGO.png">
    
    <!-- -------------------- ESTILOS -------------------- -->
    <link rel="stylesheet" href="style.css">

    <!-- [NUEVO] Estilos en línea para asegurar que el modal funcione incluso si el CSS externo falla -->
    <style>
        /* [NUEVO] Ocultar modales por defecto */
        .modal-overlay { display: none; }
        .modal-overlay.active { display: flex; }
    </style>
</head>

<body>
    <div id="DecoracióndeRayas">
        <header>
            <nav>
                <button rel="noopener norefeerer" id="AcercaDe"> Acerca De... </button>
            </nav>
            <section id="CuentayModo">
                <button id="Modo">Cambiar Modo</button>
                <button id="IniciarSesión"> Iniciar sesión </button>
                <button id="Cuenta" aria-label="Configurar cuenta"></button>
            </section>
        </header>
        
        <section id="OpcionesYLogo">        
            <div id="Opciones">
                <h1> Menú </h1>
                <div id="botones">
                    <div class="ÍconoyBotón">
                        <img src="../../Recursos_Gráficos/Sprites/Icons/Unirse a sala.png" alt="">
                        <!-- [MODIFICADO] Añadido onclick para abrir el modal -->
                        <button class="Opciones" id="UnirseSala" onclick="abrirModal('modalUnirse')"> Unirse a sala </button>
                    </div>
                    
                    <div class="ÍconoyBotón">
                        <img src="../../Recursos_Gráficos/Sprites/Icons/Crear Sala.png" alt="">
                        <!-- [MODIFICADO] Añadido onclick para abrir el modal -->
                        <button class="Opciones" id="CrearSala" onclick="abrirModal('modalCrear')"> Crear sala </button>
                    </div>

                    <div class="ÍconoyBotón">
                        <img src="../../Recursos_Gráficos/Sprites/Icons/Ajustes.png" alt="">
                        <button class="Opciones" id="Ajustes"> Ajustes</button>
                    </div>
                </div>
            </div>

            <section id="logo">
                <div>
                    <img src="../../Recursos_Gráficos/Sprites/Icons/LOGO.png" alt="Logo pixel-art de llave inglesa roja con el nombre PicoDesk.">
                    <h2> ¡BIENVENIDO! </h2>
                </div>
            </section>
        </section>
    </div>    

    <!-- ================================================================= -->
    <!-- [NUEVO] POP-UP: UNIRSE A UNA SALA                                 -->
    <!-- ================================================================= -->
    <!-- Ejemplo para el modal de Unirse -->
    <div id="modalUnirse" class="modal-overlay">
        <div class="modal-content">
            <!-- [NUEVO] Barra superior con el botón y el título -->
            <div class="modal-header">
                <button class="btn-atras" onclick="cerrarModal('modalUnirse')">◀ Atrás</button>
                <h2>Unirse a una sala</h2>
            </div>
            
            <!-- [NUEVO] Cuerpo del modal con el formulario -->
            <div class="modal-body">
                <input type="text" id="inputCodigoUnirse" class="modal-input" placeholder="código de sala..." maxlength="8">
                <button class="btn-accion btn-unirse" onclick="enviarUnirse()">UNIRSE</button>
            </div>
        </div>
    </div>

<!-- ================================================================= -->
<!-- [CORREGIDO] POP-UP: CREAR UNA SALA                                -->
<!-- ================================================================= -->
    <div id="modalCrear" class="modal-overlay">
        <div class="modal-content">
            <!-- [CORREGIDO] Ahora tiene la estructura de barra superior -->
            <div class="modal-header">
                <button class="btn-atras" onclick="cerrarModal('modalCrear')">◀ Atrás</button>
                <h2>Crear sala</h2>
            </div>
            
            <!-- [CORREGIDO] Ahora tiene la estructura de cuerpo -->
            <div class="modal-body">
                <!-- Contenedor para el tamaño de la sala -->
                <div class="tamano-sala-container">
                    <label>Tamaño de la sala</label>
                    <div class="selector-tamano">
                        <button class="btn-triangulo" onclick="cambiarTamano(-1)">◀</button>
                        <span id="valorTamano">6</span>
                        <button class="btn-triangulo" onclick="cambiarTamano(1)">▶</button>
                    </div>
                </div>
                
                <!-- Campo de entrada para el código -->
                <input type="text" id="inputCodigoCrear" class="modal-input" placeholder="código de sala..." maxlength="8">
                
                <!-- Botón de envío -->
                <button class="btn-accion btn-crear" onclick="enviarCrear()">CREAR</button>
            </div>
        </div>
    </div>

    <!-- ================================================================= -->
    <!-- [NUEVO] LÓGICA DE JAVASCRIPT (Simulación de Base de Datos)        -->
    <!-- ================================================================= -->
    <script>
        // [NUEVO] Variable global para el tamaño de la sala
        let tamanoSala = 6;

        // [NUEVO] Función para abrir un modal y aplicar el blur
        function abrirModal(idModal) {
            const modal = document.getElementById(idModal);
            if (modal) {
                modal.classList.add('active');
                // [NUEVO] Añadir clase al body para desenfocar el fondo
                document.body.classList.add('modal-abierto');
            }
        }

        // [NUEVO] Función para cerrar un modal y quitar el blur
        function cerrarModal(idModal) {
            const modal = document.getElementById(idModal);
            if (modal) {
                modal.classList.remove('active');
                // [NUEVO] Quitar clase al body
                document.body.classList.remove('modal-abierto');
                // [NUEVO] Limpiar el input al cerrar
                const input = modal.querySelector('.modal-input');
                if (input) input.value = '';
            }
        }

        // [NUEVO] Función para cambiar el tamaño de la sala (Crear Sala)
        function cambiarTamano(cambio) {
            tamanoSala += cambio;
            // [NUEVO] Límites lógicos (mínimo 2, máximo 12)
            if (tamanoSala < 2) tamanoSala = 2;
            if (tamanoSala > 12) tamanoSala = 12;
            document.getElementById('valorTamano').textContent = tamanoSala;
        }

        // [NUEVO] Simulación de envío para "Unirse a Sala"
        function enviarUnirse() {
            const codigo = document.getElementById('inputCodigoUnirse').value.trim();
            
            if (codigo === '') {
                alert('Por favor, ingresa un código de sala.');
                return;
            }

            // [NUEVO] Simulación de consulta a base de datos ficticia
            console.log(`Buscando sala con código: ${codigo}...`);
            
            // [NUEVO] Simulamos que el código "PICO" existe en la base de datos
            if (codigo.toUpperCase() === 'PICO' || codigo === '1234') {
                alert(`¡Éxito! Te has unido a la sala: ${codigo.toUpperCase()}`);
                cerrarModal('modalUnirse');
            } else {
                alert('Error: El código de sala no existe o es incorrecto. Intenta de nuevo.');
            }
        }

        // [NUEVO] Simulación de envío para "Crear Sala"
        function enviarCrear() {
            const codigo = document.getElementById('inputCodigoCrear').value.trim();
            
            if (codigo === '') {
                alert('Por favor, ingresa un código para la nueva sala.');
                return;
            }

            // [NUEVO] Simulación de inserción en base de datos ficticia
            console.log(`Creando sala con código: ${codigo.toUpperCase()} y tamaño: ${tamanoSala}...`);
            
            alert(`¡Sala creada con éxito!\nCódigo: ${codigo.toUpperCase()}\nTamaño: ${tamanoSala} jugadores.`);
            cerrarModal('modalCrear');
        }

        // [NUEVO] Cerrar modal si se hace clic fuera del contenido
        window.addEventListener('click', function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.classList.remove('active');
                document.body.classList.remove('modal-abierto');
            }
        });
    </script>
</body>
</html>
